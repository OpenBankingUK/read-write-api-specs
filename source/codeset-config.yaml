# Configuration for codeset enum alignment.
#
# Master OpenAPI files in source/openapi/ mark codeset-backed enums with
#   x-codeset-ref: <List>/<CodeSet>
# where <List> is OB_Internal_CodeSet (OB_Internal_Codeset.csv) or
# ISO_External_CodeSet (ISO_External_Codeset.csv).

# Authoritative codeset source. Generation always reads from the pinned commit;
# update `commit` deliberately when adopting newer codesets.
codesetSource:
  repository: OpenBankingUK/External_Internal_CodeSets
  branch: main
  commit: fd33a35d71403e1d62ed9a3827ecbce9c46a207f
  lists:
    OB_Internal_CodeSet: OB_Internal_Codeset.csv
    ISO_External_CodeSet: ISO_External_Codeset.csv

# Approved deviations from the authoritative codeset, keyed by master file and
# JSON pointer to the node carrying x-codeset-ref. Only add entries after review.
exceptions:
  - file: payment-initiation-openapi.yaml
    pointer: /components/schemas/OBRisk1/properties/PaymentContextCode
    codeset: OB_Internal_CodeSet/OBInternalPaymentContext1Code
    additionalValues: &deprecatedPaymentContextCodes
      - BillPayment
      - EcommerceGoods
      - EcommerceServices
      - PartyToParty
      - PispPayee
      - Other
    reason: >-
      Deprecated v3 PaymentContextCode values. They must not be used in a new
      consent or payment, but may be returned for historical payments/consents
      migrated to v4, so they are retained in the specification.
  - file: vrp-openapi.yaml
    pointer: /components/schemas/OBRisk1/properties/PaymentContextCode
    codeset: OB_Internal_CodeSet/OBInternalPaymentContext1Code
    additionalValues: *deprecatedPaymentContextCodes
    reason: >-
      Deprecated v3 PaymentContextCode values. They must not be used in a new
      consent or payment, but may be returned for historical payments/consents
      migrated to v4, so they are retained in the specification.
