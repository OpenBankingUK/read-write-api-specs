  securitySchemes:
    TPPOAuth2Security:
      type: oauth2
      description: |-
        TPP client credential authorisation flow with the ASPSP.

        FAPI 1 Advanced / OAuth 2.0 client credentials authorisation flow with the ASPSP. Access tokens are sent on resource requests using the standard HTTP Authorization header with the Bearer authentication scheme: `Authorization: Bearer <access-token>`.

        This OpenAPI security scheme represents the OAuth2 access-token requirement. Additional Open Banking/FAPI requirements such as transport security, client authentication method, signing, PAR/JAR, or certificate binding are profiled by the Open Banking security profile and may not be fully expressible in OpenAPI 3.0 securitySchemes.
      flows:
        clientCredentials:
          tokenUrl: https://authserver.example/token
          scopes:
            fundsconfirmations: Funds confirmation entitlement
    PSUOAuth2Security:
      type: oauth2
      description: |-
        OAuth flow, it is required when the PSU needs to perform SCA with the ASPSP when a TPP wants to access an ASPSP resource owned by the PSU

        FAPI 1 Advanced / OAuth 2.0 authorisation code flow with the ASPSP. Access tokens are sent on resource requests using the standard HTTP Authorization header with the Bearer scheme: `Authorization: Bearer <access_token>`

        This OpenAPI security scheme represents the OAuth2 access-token requirement. Additional Open Banking/FAPI requirements such as transport security, client authentication method, signing, PAR/JAR, or certificate binding are profiled by the Open Banking security profile and may not be fully expressible in OpenAPI 3.0 securitySchemes.
      flows:
        authorizationCode:
          authorizationUrl: https://authserver.example/authorization
          tokenUrl: https://authserver.example/token
          scopes:
            fundsconfirmations: Funds confirmation entitlement
  schemas:
    OBProxy1:
      description: Specifies an alternate assumed name for the identification of the account.
      type: object
      required:
        - Identification
        - Code
      properties:
        Identification:
          description: Identification used to indicate the account identification under another specified name.
          type: string
          minLength: 1
          maxLength: 2048
          example: '+441632960540'
        Code:
          $ref: '#/components/schemas/ExternalProxyAccountType1Code'
        Type:
          type: string
          description: Type of the proxy identification.
          minLength: 1
          maxLength: 35
          example: Telephone
    OBCashAccountDebtorWithName:
      type: object
      required:
        - SchemeName
        - Identification
      description: Unambiguous identification of the account of the debtor to which a confirmation of funds consent will be applied.
      properties:
        SchemeName:
          $ref: '#/components/schemas/OBInternalAccountIdentification4Code'
        Identification:
          description: Identification assigned by an institution to identify an account. This identification is known by the account owner.
          type: string
          minLength: 1
          maxLength: 256
          example: '30949301273801'
        Name:
          description: |-
            Name of the account, as assigned by the account servicing institution.

            Usage: The account name is the name or names of the account owner(s) represented at an account level. The account name is not the product name or the nickname of the account.
          type: string
          minLength: 1
          maxLength: 350
          example: Jane Smith
        SecondaryIdentification:
          description: |-
            This is secondary identification of the account, as assigned by the account servicing institution.

            This can be used by building societies to additionally identify accounts with a roll number (in addition to a sort code and account number combination).
          type: string
          minLength: 1
          maxLength: 34
          example: Roll 56988
        Proxy:
          $ref: '#/components/schemas/OBProxy1'
    OBInternalAccountIdentification4Code:
      description: |-
        Name of the identification scheme, in a coded form as published in an external list.

        For a full list of values see `OBInternalAccountIdentification4Code` in *OB_Internal_CodeSet* [here](https://github.com/OpenBankingUK/External_Internal_CodeSets/blob/main/OB_Internal_Codeset.csv)
      type: string
      x-namespaced-enum:
        - UK.OBIE.BBAN
        - UK.OBIE.IBAN
        - UK.OBIE.PAN
        - UK.OBIE.Paym
        - UK.OBIE.SortCodeAccountNumber
        - UK.OBIE.Wallet
      example: UK.OBIE.SortCodeAccountNumber
    ExternalProxyAccountType1Code:
      description: |-
        Specifies the external proxy account type code, as published in the proxy account type external code set.

        For a full list of values refer to `ExternalProxyAccountType1Code` in *ISO_External_CodeSet* [here](https://github.com/OpenBankingUK/External_Internal_CodeSets/blob/main/ISO_External_Codeset.csv)
      type: string
      enum:
        - TELE
        - EMAL
        - DNAM
        - CINC
        - COTX
        - COID
        - CUST
        - DRLC
        - EIDN
        - EWAL
        - PVTX
        - LEIC
        - MBNO
        - NIDN
        - CCPT
        - SHID
        - SOSE
        - TOKN
        - UBIL
        - VIPN
        - BIID
      example: TELE
    ISODateTime:
      description: |-
        All dates in the JSON payloads are represented in ISO 8601 date-time format.

        All date-time fields in responses must include the timezone. An example is below:

        `2017-04-05T10:43:07+00:00`
      type: string
      format: date-time
    OBActiveOrHistoricCurrencyAndAmount:
      type: object
      required:
        - Amount
        - Currency
      description: Amount of money to be confirmed as available funds in the debtor account. Contains an `Amount` and a `Currency`.
      properties:
        Amount:
          $ref: '#/components/schemas/OBActiveCurrencyAndAmount_SimpleType'
        Currency:
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
    OBActiveCurrencyAndAmount_SimpleType:
      description: A number of monetary units specified in an active currency where the unit of currency is explicit and compliant with ISO 4217.
      type: string
      pattern: '^\d{1,13}$|^\d{1,13}\.\d{1,5}$'
      example: '20.00'
    ActiveOrHistoricCurrencyCode:
      description: A code allocated to a currency by a Maintenance Agency under an international identification scheme, as described in the latest edition of the international standard ISO 4217 "Codes for the representation of currencies and funds".
      type: string
      pattern: '^[A-Z]{3,3}$'
      example: GBP
    Links:
      type: object
      description: Links relevant to the payload
      properties:
        Self:
          type: string
          format: uri
        First:
          type: string
          format: uri
        Prev:
          type: string
          format: uri
        Next:
          type: string
          format: uri
        Last:
          type: string
          format: uri
      additionalProperties: false
      required:
        - Self
    Meta:
      title: MetaData
      type: object
      description: Meta Data relevant to the payload
      properties:
        TotalPages:
          type: integer
          format: int32
        FirstAvailableDateTime:
          $ref: '#/components/schemas/ISODateTime'
        LastAvailableDateTime:
          $ref: '#/components/schemas/ISODateTime'
      additionalProperties: false
    OBError1:
      type: object
      properties:
        ErrorCode:
          $ref: '#/components/schemas/OBExternalStatusReason1Code'
        Message:
          description: |-
            A description of the error that occurred. e.g., `'A mandatory field isn't supplied'` or `'RequestedExecutionDateTime must be in future'`

            OBL doesn't standardise this field.
          type: string
          minLength: 1
          maxLength: 500
          example: InstructedAmount.Currency must match the currency of the underlying payment account.
        Path:
          description: Recommended but optional reference to the JSON Path of the field with error, e.g., `Data.InstructedAmount.Currency`
          type: string
          minLength: 1
          maxLength: 500
          example: Data.InstructedAmount.Currency
        Url:
          description: URL to help remediate the problem, or provide more information, or to API Reference, or help etc
          type: string
          example: https://docs.alphabank.com/open-banking/errors/U002
      required:
        - ErrorCode
      additionalProperties: false
      minProperties: 1
    OBErrorResponse1:
      description: An array of detail error codes, and messages, and URLs to documentation to help remediation.
      type: object
      properties:
        Id:
          description: A unique reference for the error instance, for audit purposes, in case of unknown/unclassified errors.
          type: string
          minLength: 1
          maxLength: 40
        Code:
          description: |-
            **Deprecated**

            High level textual error code, to help categorise the errors.
          type: string
          minLength: 1
          example: UK.OBIE.Field.Invalid
          maxLength: 40
        Message:
          description: |-
            **Deprecated**

