openapi: 3.0.0
info:
  title: Confirmation of Funds API Specification
  description: |-
    Swagger for Confirmation of Funds API Specification.

    **Please Note**: There are no optional fields, if a field is not marked as “Required” it is a Conditional field.
  termsOfService: https://www.openbanking.org.uk/terms
  contact:
    name: Service Desk
    email: ServiceDesk@openbanking.org.uk
  license:
    name: open-licence
    url: https://www.openbanking.org.uk/open-licence
  version: 4.0.1
tags:
  - name: Funds Confirmation Consents
    description: Operations related to funds confirmation consents
  - name: Funds Confirmations
    description: Operations related to funds confirmations
paths:
  /funds-confirmation-consents:
    post:
      tags:
        - Funds Confirmation Consents
      summary: Create a Funds Confirmation Consent
      description: |-
        Enables a CBPII to ask an ASPSP to create a new funds-confirmation-consent resource, by sending a copy of the consent to the ASPSP.

        On success (HTTP 201), the response contains a `ConsentId`, `CreationDateTime`, the current `Status` of the consent, `StatusUpdateDateTime`, and the `DebtorAccount` associated with the consent. The consent may initially be returned with status `AWAU` (`AwaitingAuthorisation`).

        **Note:** Creating this consent does not immediately authorise funds confirmations. The PSU will need to authenticate and authorise the consent with their ASPSP before the consent can be used for funds confirmation requests.
      operationId: CreateFundsConfirmationConsents
      parameters:
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-customer-user-agent'
        - $ref: '#/components/parameters/x-jws-signature'
        - $ref: '#/components/parameters/x-client-id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OBFundsConfirmationConsent1'
            examples:
              FundsConfirmationConsentCreateRequest:
                $ref: '#/components/examples/FundsConfirmationConsentCreateRequest'
        description: Default
        required: true
      responses:
        '201':
          $ref: '#/components/responses/201FundsConfirmationConsentsCreated'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '415':
          $ref: '#/components/responses/415Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - TPPOAuth2Security:
            - fundsconfirmations
  /funds-confirmation-consents/{ConsentId}:
    get:
      tags:
        - Funds Confirmation Consents
      summary: Get a Funds Confirmation Consent
      description: |-
        Enables a CBPII to retrieve the status of a Funds Confirmation Consent resource.

        On success (HTTP 200), the response contains the consent `ConsentId`, `CreationDateTime`, current `Status`, `StatusUpdateDateTime`, optional `StatusReason`, optional `ExpirationDateTime`, and the `DebtorAccount` associated with the consent.

        **Note:** This operation is read-only. It does not change the consent status, authorise the consent, revoke the consent, or perform a funds availability check.
      operationId: GetFundsConfirmationConsentsConsentId
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-customer-user-agent'
        - $ref: '#/components/parameters/x-jws-signature'
        - $ref: '#/components/parameters/x-client-id'
      responses:
        '200':
          $ref: '#/components/responses/200FundsConfirmationConsentsConsentIdRead'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - TPPOAuth2Security:
            - fundsconfirmations
    delete:
      tags:
        - Funds Confirmation Consents
      summary: Delete a Funds Confirmation Consent
      description: |-
        Enables a CBPII to inform the PSU's ASPSP that the PSU has revoked their consent to provide funds confirmations.

        On success (HTTP 204), the response has no body. The ASPSP confirms that the funds-confirmation-consent resource identified by `ConsentId` has been deleted or revoked for future funds confirmation use.

        **Note:** After this operation succeeds, the consent can no longer be used to create funds confirmation requests.
      operationId: DeleteFundsConfirmationConsentsConsentId
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-customer-user-agent'
        - $ref: '#/components/parameters/x-jws-signature'
        - $ref: '#/components/parameters/x-client-id'
      responses:
        '204':
          $ref: '#/components/responses/204FundsConfirmationConsentsConsentIdDeleted'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - TPPOAuth2Security:
            - fundsconfirmations
  /funds-confirmations:
    post:
      tags:
        - Funds Confirmations
      summary: Create a Funds Confirmation Request
      description: |-
        Enables a CBPII to check whether a PSU has sufficient available funds for a CBPII transaction.

        The request identifies the authorised funds-confirmation consent using `ConsentId`, provides a CBPII-assigned `Reference`, and specifies the `InstructedAmount` to check.

        On success (HTTP 201), the response contains a `FundsConfirmationId`, the related `ConsentId`, `CreationDateTime`, the boolean `FundsAvailable` result, the `Reference`, and the `InstructedAmount` checked.

        **Note:** This operation checks availability only; it does not reserve funds, move funds, or initiate a payment.
      operationId: CreateFundsConfirmations
      parameters:
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-customer-user-agent'
        - $ref: '#/components/parameters/x-jws-signature'
        - $ref: '#/components/parameters/x-client-id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OBFundsConfirmation1'
            examples:
              FundsConfirmationCreateRequest:
                $ref: '#/components/examples/FundsConfirmationCreateRequest'
              FundsConfirmationUsdRequest:
                $ref: '#/components/examples/FundsConfirmationUsdRequest'
        description: Default
        required: true
      responses:
        '201':
          $ref: '#/components/responses/201FundsConfirmationsCreated'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '415':
          $ref: '#/components/responses/415Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - PSUOAuth2Security:
            - fundsconfirmations
servers:
  - url: /open-banking/v4.0/cbpii
components:
  parameters:
    ConsentId:
      name: ConsentId
      in: path
      description: '`ConsentId`'
      required: true
      schema:
        type: string
        example: FCC-20260401-0001
    Authorization:
      in: header
      name: Authorization
      required: true
      description: An Authorisation Token as per <https://tools.ietf.org/html/rfc6750>
      schema:
        type: string
        example: Bearer <access-token>
    x-customer-user-agent:
      in: header
      name: x-customer-user-agent
      description: Indicates the user-agent that the PSU is using.
      required: false
      schema:
        type: string
        example: Mozilla/5.0 (Example PSU Device)
    x-fapi-customer-ip-address:
      in: header
      name: x-fapi-customer-ip-address
      required: false
      description: The PSU's IP address if the PSU is currently logged in with the TPP.
      schema:
        type: string
        example: 203.0.113.42
    x-fapi-auth-date:
      in: header
      name: x-fapi-auth-date
      required: false
      description: |-
        The time when the PSU last logged in with the TPP.

        All dates in the HTTP headers are represented as RFC 7231 Full Dates. An example is below:

        `Sun, 10 Sep 2017 19:43:31 UTC`
      schema:
        type: string
        pattern: '^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4} \d{2}:\d{2}:\d{2} (GMT|UTC)$'
        example: Wed, 01 Apr 2026 10:15:30 GMT
    x-fapi-interaction-id:
      in: header
      name: x-fapi-interaction-id
      required: false
      description: An RFC4122 UID used as a correlation id.
      schema:
        type: string
        example: 93bac548-d2de-4546-b106-880a5018460d
    x-jws-signature:
      in: header
      name: x-jws-signature
      required: false
      description: A detached JWS signature of the body of the payload.
      schema:
        type: string
        example: eyJ...header.eyJ...payload.signature
    x-client-id:
      in: header
      name: x-client-id
      required: false
      description: |-
        Only used if an ASPSP requires the client ID in order to return rate limit headers.

        TPPs __must__ refer to ASPSP developer portals for further information on any rate limit policies, if the headers are supported and any additional requirements.

        This header __must not__ be used for client authentication
      schema:
        type: string
        example: cbpii-client-12345
  headers:
    RateLimit-Policy:
      required: false
      description: |-
        TPPs __must__ refer to ASPSP developer portals for further information on any rate limit policies, if the headers are supported and any additional requirements.

        A non-empty list of Quota Policy Items. The Item value __MUST__ be a String.

        Example:
        `RateLimit-Policy: "default";q=100;w=10`

        The **REQUIRED** "q" parameter indicates the quota allocated by this policy measured in quota units.

        The **OPTIONAL** "w" parameter value conveys a time window.
      schema:
        type: string
        example: '"default";q=100;w=10'
    RateLimit:
      required: false
      description: |-
        TPPs __must__ refer to ASPSP developer portals for further information on any rate limit policies, if the headers are supported and any additional requirements.

        A server uses the "RateLimit" response header field to communicate the current service limit for a quota policy for a particular partition key.

        Example:
        `RateLimit: "default";r=50;t=30`

        The **REQUIRED** "r" parameter value conveys the remaining quota units for the identified policy.

        The **OPTIONAL** "t" parameter value conveys the time window reset time for the identified policy.
      schema:
        type: string
        example: '"default";r=50;t=30'
    x-jws-signature:
      required: false
      description: A detached JWS signature of the body of the payload.
      schema:
        type: string
        example: eyJ...header.eyJ...payload.signature
  examples:
    FundsConfirmationConsentCreateRequest:
      summary: Create a funds-confirmation consent
      value:
        Data:
          ExpirationDateTime: '2026-10-01T10:15:30+00:00'
          DebtorAccount:
            SchemeName: UK.OBIE.SortCodeAccountNumber
            Identification: '30949301273801'
            Name: Jane Smith
            SecondaryIdentification: Roll 56988
            Proxy:
              Identification: '+441632960540'
              Code: TELE
              Type: Telephone
    FundsConfirmationConsentCreateResponse:
      summary: Funds-confirmation consent awaiting authorisation
      value:
        Data:
          ConsentId: FCC-20260401-0001
          CreationDateTime: '2026-04-01T10:15:30+00:00'
          Status: AWAU
          StatusUpdateDateTime: '2026-04-01T10:15:30+00:00'
          ExpirationDateTime: '2026-10-01T10:15:30+00:00'
          DebtorAccount:
            SchemeName: UK.OBIE.SortCodeAccountNumber
            Identification: '30949301273801'
            Name: Jane Smith
            SecondaryIdentification: Roll 56988
            Proxy:
              Identification: '+441632960540'
              Code: TELE
              Type: Telephone
        Links:
          Self: https://api.alphabank.com/open-banking/v4.0/cbpii/funds-confirmation-consents/FCC-20260401-0001
        Meta: {}
    FundsConfirmationConsentReadAuthorisedResponse:
      summary: Authorised funds-confirmation consent
      value:
        Data:
          ConsentId: FCC-20260401-0001
          CreationDateTime: '2026-04-01T10:15:30+00:00'
          Status: AUTH
          StatusUpdateDateTime: '2026-04-01T10:20:30+00:00'
          ExpirationDateTime: '2026-10-01T10:15:30+00:00'
          DebtorAccount:
            SchemeName: UK.OBIE.SortCodeAccountNumber
            Identification: '30949301273801'
            Name: Jane Smith
            SecondaryIdentification: Roll 56988
            Proxy:
              Identification: '+441632960540'
              Code: TELE
              Type: Telephone
        Links:
          Self: https://api.alphabank.com/open-banking/v4.0/cbpii/funds-confirmation-consents/FCC-20260401-0001
        Meta: {}
    FundsConfirmationConsentReadMaskedPanResponse:
      summary: Authorised funds-confirmation consent with masked PAN
      description: ASPSPs may partially mask the account identification when returning PAN account details on GET.
      value:
        Data:
          ConsentId: FCC-20260401-0002
          CreationDateTime: '2026-04-01T10:15:30+00:00'
          Status: AUTH
          StatusUpdateDateTime: '2026-04-01T10:20:30+00:00'
          ExpirationDateTime: '2026-10-01T10:15:30+00:00'
          DebtorAccount:
            SchemeName: UK.OBIE.PAN
            Identification: '4444********1111'
            Name: Jane Smith
            SecondaryIdentification: '008419'
            Proxy:
              Identification: '+441632960540'
              Code: TELE
              Type: Telephone
        Links:
          Self: https://api.alphabank.com/open-banking/v4.0/cbpii/funds-confirmation-consents/FCC-20260401-0002
        Meta: {}
    FundsConfirmationCreateRequest:
      summary: Create a funds-confirmation request
      value:
        Data:
          ConsentId: FCC-20260401-0001
          Reference: CARD-PURCHASE-001
          InstructedAmount:
            Amount: '20.00'
            Currency: GBP
    FundsConfirmationCreateResponse:
      summary: Funds are available for the card purchase
      value:
        Data:
          FundsConfirmationId: FC-20260401-0001
          ConsentId: FCC-20260401-0001
          CreationDateTime: '2026-04-01T10:25:30+00:00'
          FundsAvailable: true
          Reference: CARD-PURCHASE-001
          InstructedAmount:
            Amount: '20.00'
            Currency: GBP
        Links:
          Self: https://api.alphabank.com/open-banking/v4.0/cbpii/funds-confirmations/FC-20260401-0001
        Meta: {}
    FundsConfirmationUsdRequest:
      summary: Create a funds-confirmation request for a USD account
      description: Funds can be confirmed in USD only where the underlying payment account currency is USD.
      value:
        Data:
          ConsentId: FCC-20260401-USD1
          Reference: CARD-PURCHASE-USD
          InstructedAmount:
            Amount: '20.00'
            Currency: USD
    FundsConfirmationUsdResponse:
      summary: Funds are available for the USD card purchase
      description: Funds can be confirmed in USD only where the underlying payment account currency is USD.
      value:
        Data:
          FundsConfirmationId: FC-20260401-USD1
          ConsentId: FCC-20260401-USD1
          CreationDateTime: '2026-04-01T10:25:30+00:00'
          FundsAvailable: true
          Reference: CARD-PURCHASE-USD
          InstructedAmount:
            Amount: '20.00'
            Currency: USD
        Links:
          Self: https://api.alphabank.com/open-banking/v4.0/cbpii/funds-confirmations/FC-20260401-USD1
        Meta: {}
    Error400InvalidField:
      summary: Invalid field value
      value:
        Code: UK.OBIE.Field.Invalid
        Message: One or more request fields are invalid.
        Errors:
          - ErrorCode: U002
            Message: InstructedAmount.Currency must match the currency of the underlying payment account.
            Path: Data.InstructedAmount.Currency
            Url: https://docs.alphabank.com/open-banking/errors/U002
    Error403InvalidConsentStatus:
      summary: Consent is not authorised for funds confirmation
      value:
        Code: UK.OBIE.Resource.InvalidConsentStatus
        Message: The consent is not in a status that allows funds confirmation.
        Errors:
          - ErrorCode: U009
            Message: The funds-confirmation consent is not authorised for this request.
            Path: Data.ConsentId
            Url: https://docs.alphabank.com/open-banking/errors/U009
    Error500Unexpected:
      summary: Unexpected processing error
      value:
        Id: ERR-20260401-0001
        Code: UK.OBIE.UnexpectedError
        Message: An unexpected error occurred while processing the request.
        Errors:
          - ErrorCode: U000
            Message: The ASPSP could not complete the request due to an unexpected processing error.
            Url: https://docs.alphabank.com/open-banking/errors/U000
  responses:
    201FundsConfirmationConsentsCreated:
      description: Funds Confirmation Consent Created
      headers:
        x-fapi-interaction-id:
          required: true
          description: An RFC4122 UID used as a correlation id.
          schema:
            type: string
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        x-jws-signature:
          $ref: '#/components/headers/x-jws-signature'
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/OBFundsConfirmationConsentResponse1'
          examples:
            FundsConfirmationConsentCreateResponse:
              $ref: '#/components/examples/FundsConfirmationConsentCreateResponse'
        application/json:
          schema:
            $ref: '#/components/schemas/OBFundsConfirmationConsentResponse1'
          examples:
            FundsConfirmationConsentCreateResponse:
              $ref: '#/components/examples/FundsConfirmationConsentCreateResponse'
        application/jose+jwe:
          schema:
            $ref: '#/components/schemas/OBFundsConfirmationConsentResponse1'
    200FundsConfirmationConsentsConsentIdRead:
      description: Funds Confirmation Consent Read
      headers:
        x-fapi-interaction-id:
          required: true
          description: An RFC4122 UID used as a correlation id.
          schema:
            type: string
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        x-jws-signature:
          $ref: '#/components/headers/x-jws-signature'
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/OBFundsConfirmationConsentResponse1'
          examples:
            FundsConfirmationConsentReadAuthorisedResponse:
              $ref: '#/components/examples/FundsConfirmationConsentReadAuthorisedResponse'
            FundsConfirmationConsentReadMaskedPanResponse:
              $ref: '#/components/examples/FundsConfirmationConsentReadMaskedPanResponse'
        application/json:
          schema:
            $ref: '#/components/schemas/OBFundsConfirmationConsentResponse1'
          examples:
            FundsConfirmationConsentReadAuthorisedResponse:
              $ref: '#/components/examples/FundsConfirmationConsentReadAuthorisedResponse'
            FundsConfirmationConsentReadMaskedPanResponse:
              $ref: '#/components/examples/FundsConfirmationConsentReadMaskedPanResponse'
        application/jose+jwe:
          schema:
            $ref: '#/components/schemas/OBFundsConfirmationConsentResponse1'
    204FundsConfirmationConsentsConsentIdDeleted:
      description: Funds Confirmation Consent Deleted
      headers:
        x-fapi-interaction-id:
          required: true
          description: An RFC4122 UID used as a correlation id.
          schema:
            type: string
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        x-jws-signature:
          $ref: '#/components/headers/x-jws-signature'
    201FundsConfirmationsCreated:
      description: Funds Confirmation Created
      headers:
        x-fapi-interaction-id:
          required: true
          description: An RFC4122 UID used as a correlation id.
          schema:
            type: string
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        x-jws-signature:
          $ref: '#/components/headers/x-jws-signature'
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/OBFundsConfirmationResponse1'
          examples:
            FundsConfirmationCreateResponse:
              $ref: '#/components/examples/FundsConfirmationCreateResponse'
            FundsConfirmationUsdResponse:
              $ref: '#/components/examples/FundsConfirmationUsdResponse'
        application/json:
          schema:
            $ref: '#/components/schemas/OBFundsConfirmationResponse1'
          examples:
            FundsConfirmationCreateResponse:
              $ref: '#/components/examples/FundsConfirmationCreateResponse'
            FundsConfirmationUsdResponse:
              $ref: '#/components/examples/FundsConfirmationUsdResponse'
        application/jose+jwe:
          schema:
            $ref: '#/components/schemas/OBFundsConfirmationResponse1'
    400Error:
      description: Bad request
      headers:
        x-fapi-interaction-id:
          required: true
          description: An RFC4122 UID used as a correlation id.
          schema:
            type: string
        x-jws-signature:
          $ref: '#/components/headers/x-jws-signature'
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/OBErrorResponse1'
          examples:
            Error400InvalidField:
              $ref: '#/components/examples/Error400InvalidField'
        application/json:
          schema:
            $ref: '#/components/schemas/OBErrorResponse1'
          examples:
            Error400InvalidField:
              $ref: '#/components/examples/Error400InvalidField'
        application/jose+jwe:
          schema:
            $ref: '#/components/schemas/OBErrorResponse1'
    401Error:
      description: Unauthorized
      headers:
        x-fapi-interaction-id:
          required: true
          description: An RFC4122 UID used as a correlation id.
          schema:
            type: string
        x-jws-signature:
          $ref: '#/components/headers/x-jws-signature'
    403Error:
      description: Forbidden
      headers:
        x-fapi-interaction-id:
          required: true
          description: An RFC4122 UID used as a correlation id.
          schema:
            type: string
        x-jws-signature:
          $ref: '#/components/headers/x-jws-signature'
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/OBErrorResponse1'
          examples:
            Error403InvalidConsentStatus:
              $ref: '#/components/examples/Error403InvalidConsentStatus'
        application/json:
          schema:
            $ref: '#/components/schemas/OBErrorResponse1'
          examples:
            Error403InvalidConsentStatus:
              $ref: '#/components/examples/Error403InvalidConsentStatus'
        application/jose+jwe:
          schema:
            $ref: '#/components/schemas/OBErrorResponse1'
    405Error:
      description: Method Not Allowed
      headers:
        x-fapi-interaction-id:
          required: true
          description: An RFC4122 UID used as a correlation id.
          schema:
            type: string
        x-jws-signature:
          $ref: '#/components/headers/x-jws-signature'
    406Error:
      description: Not Acceptable
      headers:
        x-fapi-interaction-id:
          required: true
          description: An RFC4122 UID used as a correlation id.
          schema:
            type: string
        x-jws-signature:
          $ref: '#/components/headers/x-jws-signature'
    415Error:
      description: Unsupported Media Type
      headers:
        x-fapi-interaction-id:
          required: true
          description: An RFC4122 UID used as a correlation id.
          schema:
            type: string
