# Regenerates dist/openapi from the source/openapi masters so codeset-backed
# enums match the pinned OpenBankingUK/External_Internal_CodeSets CSVs.
#
# - Same-repository PRs: regenerated dist files are committed back to the PR
#   branch so they can be audited before merge. Commits pushed with
#   GITHUB_TOKEN carry [skip ci] so no follow-up run (or approval prompt) is
#   created; a second run would be a no-op anyway, so this cannot loop.
# - Fork PRs and manual runs on the default branch: check only; fails if dist
#   is out of date.
# The full report is written to the job summary and uploaded as an artifact.
name: Codeset enums

on:
  pull_request:
    paths:
      - source/**
      - dist/openapi/**
      - scripts/codesets/**
      - .github/workflows/codeset-enums.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: codeset-enums-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      CAN_PUSH: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch) }}
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same-repo PRs check out the branch head so a commit can be pushed;
          # forks use the default merge ref.
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/codesets/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/codesets/requirements.txt

      - name: Generate dist files
        run: |
          if [ "$CAN_PUSH" = "true" ]; then
            python scripts/codesets/generate.py --report codeset-report.md
          else
            python scripts/codesets/generate.py --check --report codeset-report.md
          fi

      - name: Upload report
        if: always() && hashFiles('codeset-report.md') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeset-report
          path: codeset-report.md

      - name: Commit regenerated dist files
        if: env.CAN_PUSH == 'true'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- dist/openapi; then
            echo "dist/openapi is already up to date; nothing to commit."
            echo "✅ dist/openapi already up to date; no commit made." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git --no-pager diff --stat -- dist/openapi
          pin=$(python -c "import yaml;print(yaml.safe_load(open('source/codeset-config.yaml'))['codesetSource']['commit'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/openapi
          git commit -m "Regenerate dist OpenAPI codeset enums [skip ci]" \
            -m "Generated by the Codeset enums workflow from source/openapi with OpenBankingUK/External_Internal_CodeSets@${pin}."
          git push origin "HEAD:refs/heads/${BRANCH}"
          # The pushed commit is the new PR head but has no runs ([skip ci]),
          # so attach a status to it that links back to this run's report.
          gh api "repos/${GITHUB_REPOSITORY}/statuses/$(git rev-parse HEAD)" \
            -f state=success -f context="Codeset enums / generate" \
            -f description="dist generated from source/openapi and pinned codesets" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "📝 Committed regenerated dist files to \`${BRANCH}\`:"
            echo '```'
            git --no-pager show --stat --format='%h %s' HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
